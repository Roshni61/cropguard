services:
  - type: web
    name: cropguard-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
